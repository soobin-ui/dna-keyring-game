<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>첫 화면 시안 A · 검진표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Paperlogy,sans-serif;color:#17323A;background:#BFE6D1;
    background-image:linear-gradient(rgba(255,255,255,.35) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.35) 2px,transparent 2px);background-size:46px 46px}
  .wrap{width:390px;margin:0 auto;padding:18px 16px 16px;min-height:100vh;display:flex;flex-direction:column}
  /* 위: 센터 이름 + 상태 */
  .center{text-align:center;font-weight:800;font-size:15px;color:#0B6E63;letter-spacing:.02em}
  .center small{display:block;font-size:12px;font-weight:600;color:#3E7D73;margin-top:2px}
  /* 클립보드 */
  .board{position:relative;margin-top:14px;background:#2E8C80;border-radius:20px;padding:30px 12px 12px;box-shadow:0 6px 0 #1F6B61}
  .clip{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:126px;height:34px;border-radius:10px;background:linear-gradient(#E9EEF0,#B9C4C8);box-shadow:0 3px 0 #8A979B,inset 0 2px 0 #fff}
  .clip::after{content:'';position:absolute;left:50%;top:9px;transform:translateX(-50%);width:46px;height:9px;border-radius:9px;background:#7D8A8E}
  .paper{background:#FFFDF6;border-radius:6px;padding:16px 16px 14px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
  .form-top{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:700;color:#8A9A96;border-bottom:2px solid #17323A;padding-bottom:6px}
  .ttl{display:flex;align-items:center;gap:12px;padding:12px 0 12px;border-bottom:1px solid #D9E4DF}
  .ttl h1{flex:1;font-size:25px;font-weight:900;line-height:1.25;text-align:left}
  .ttl h1 em{font-style:normal;color:#0E9F8E}
  .kr{width:66px;flex:none;text-align:center}
  .kr img{width:46px;filter:grayscale(1) contrast(1.05);transform:rotate(-6deg)}
  .kr span{display:block;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;margin-top:2px}
  .stat{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:#3E5B57;padding:9px 0 4px}
  .stat i{width:9px;height:9px;border-radius:50%;background:#20C9A8;box-shadow:0 0 0 3px rgba(32,201,168,.25);animation:led 1.2s infinite}
  @keyframes led{50%{opacity:.3}}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th{font-size:11.5px;font-weight:700;color:#8A9A96;text-align:left;padding:4px 0;border-bottom:1px solid #17323A}
  th:last-child,td:last-child{text-align:center;width:62px}
  td{padding:10px 0;border-bottom:1px dashed #C9D6D1;vertical-align:middle}
  .item{display:flex;align-items:center;gap:10px}
  .item img{width:44px;height:44px;flex:none}
  .item b{display:block;font-size:17px;font-weight:800;line-height:1.25}
  .item small{display:block;font-size:12.5px;color:#6A807C;font-weight:600;margin-top:2px}
  .box{display:inline-grid;place-items:center;width:30px;height:30px;border:2.5px solid #17323A;border-radius:6px;font-weight:900;font-size:18px}
  .now td{background:linear-gradient(90deg,rgba(255,201,59,.28),rgba(255,201,59,0))}
  .now .lab{display:inline-block;font-size:12px;font-weight:800;background:#FFC93B;border-radius:6px;padding:3px 7px}
  .lock{opacity:.45}
  .sign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;font-size:12px;color:#8A9A96;font-weight:600}
  .sign .ln{flex:1;margin-left:8px;border-bottom:1px solid #9FB1AC;height:14px}
  .cta{margin-top:14px;display:block;width:100%;padding:16px;border:0;border-radius:16px;background:#FFC93B;color:#17323A;font:inherit;font-size:18px;font-weight:800;box-shadow:0 4px 0 #D9A41A}
  .foot{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#3E7D73;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <p class="center">바이오헬스 정밀검진센터<small>DNA 키링 체험 · 대기 중 검사</small></p>
  <div class="board"><span class="clip"></span>
    <div class="paper">
      <div class="form-top"><span>검진표 No.0427</span><span>2026.11 CO-SHOW</span></div>
      <div class="ttl">
        <h1>내 <em>DNA 키링</em>이<br>만들어지는 중!</h1>
        <div class="kr"><img src="../img/keyring.png" alt=""><span>0 / 3</span></div>
      </div>
      <p class="stat"><i></i>온수조 처리 중 · 기다리는 동안 해 보세요</p>
      <table>
        <tr><th>검사 항목</th><th>확인</th></tr>
        <tr class="now"><td><div class="item"><img src="../img/icon_spot.png" alt=""><div><b>틀린그림찾기</b><small>쉬움·어려움 중 골라요</small></div></div></td><td><span class="lab">지금</span></td></tr>
        <tr class="lock"><td><div class="item"><img src="../img/icon_cards.png" alt=""><div><b>실험실 카드 뒤집기</b><small>단계마다 카드가 늘어요</small></div></div></td><td><span class="box"></span></td></tr>
        <tr class="lock"><td><div class="item"><img src="../img/icon_ox.png" alt=""><div><b>DNA 상식 OX 퀴즈</b><small>5문제 + 짧은 해설</small></div></div></td><td><span class="box"></span></td></tr>
      </table>
      <p class="sign">검사자 확인<span class="ln"></span></p>
    </div>
  </div>
  <button class="cta">1번 검사 시작하기</button>
  <p class="foot">CO-SHOW 2026 · 바이오헬스 혁신융합대학</p>
</div>
</body>
</html>
